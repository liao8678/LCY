<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166154">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="巡查申請">
  <title>支撐架使用個案巡查申請</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./vendor/supabase-2.119.0.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./pwa.js"></script>
</head>
<body>
  <header class="site-header"><div class="brand"><span class="brand-icon" aria-hidden="true">＋</span> 支撐架安全巡查<span class="brand-note">SHORING INSPECTION</span></div></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">支撐穩固，施工才安心。</p>
      <h1 id="page-title">支撐架使用個案巡查申請</h1>
      <p>工地支撐架組立完成、混凝土澆置前或拆除前，<br class="mobile-break">填寫表單申請巡查，由管理單位安排檢查。</p>
    </section>
    <div class="app-tools"><button id="install-button" class="secondary" type="button" hidden>安裝巡查申請</button><p id="install-help" class="muted">可透過瀏覽器選單安裝；iPhone／iPad 請在 Safari 分享選單選「加入主畫面」。</p></div>
    <p id="connection-message" class="message" role="status" aria-live="polite" hidden></p>
    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading"><h2 id="form-title">新增巡查申請</h2><span class="muted">所有欄位皆為必填</span></div>
      <form id="inspection-form">
        <fieldset id="form-fields">
          <div class="form-grid">
            <label for="applicant-name">申請人<input id="applicant-name" name="applicant_name" required maxlength="100" autocomplete="name" placeholder="例如：王小明（示範姓名）"></label>
            <label for="applicant-unit">申請單位<input id="applicant-unit" name="applicant_unit" required maxlength="100" autocomplete="organization" placeholder="例如：示範營造公司（虛構）"></label>
            <label for="project-name">工程名稱<input id="project-name" name="project_name" required maxlength="200" placeholder="例如：示範大樓新建工程"></label>
            <label for="site-location">巡查地點<input id="site-location" name="site_location" required maxlength="200" placeholder="例如：示範工地 B1 樓板"></label>
            <label for="support-type">支撐架型式<select id="support-type" name="support_type" required><option value="" disabled selected>請選擇支撐架型式</option><option>系統式支撐架</option><option>框式鋼管支撐</option><option>可調式鋼管支柱</option><option>其他</option></select></label>
            <label for="support-height">支撐高度<select id="support-height" name="support_height" required><option value="" disabled selected>請選擇支撐高度</option><option>未滿 5 公尺</option><option>5 公尺以上未滿 7 公尺</option><option>7 公尺以上</option></select></label>
            <label for="inspection-stage">申請巡查階段<select id="inspection-stage" name="inspection_stage" required><option value="" disabled selected>請選擇巡查階段</option><option>組立完成檢查</option><option>混凝土澆置前檢查</option><option>澆置中巡查</option><option>拆除前檢查</option></select></label>
            <label for="preferred-date">希望巡查日期<input id="preferred-date" name="preferred_date" type="date" required></label>
            <label class="full-width" for="description">個案說明<textarea id="description" name="description" required maxlength="2000" rows="5" placeholder="請說明使用範圍、樓層或區域、預定澆置時間及需特別注意的事項。"></textarea><span class="field-hint">最多 2,000 字；此為公開示範，請使用虛構姓名與地點，勿填電話等個人資料。</span></label>
          </div>
          <div class="form-footer"><span class="muted">申請時間由系統自動記錄</span><button id="submit-button" type="submit">送出申請 <span aria-hidden="true">↗</span></button></div>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
    </section>
    <section class="requests-section" aria-labelledby="list-title">
      <div class="section-heading list-heading"><div><p class="eyebrow">RECENT APPLICATIONS</p><h2 id="list-title">最近申請 <span class="count" id="request-count">—</span></h2></div><button id="refresh-button" class="secondary" type="button">↻ 重新整理</button></div>
      <p class="list-caption">顯示最近 20 筆，依申請時間由新到舊排列。</p>
      <p id="list-message" class="message" role="status" aria-live="polite">正在載入巡查申請…</p>
      <div id="request-list" class="request-list" aria-busy="true"></div>
    </section>
  </main>
  <footer class="site-footer">支撐架安全巡查 <span aria-hidden="true">·</span> 每一次巡查，都是工地安全的保障。</footer>
</body>
</html>
